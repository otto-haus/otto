name: CodeQL

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: "32 9 * * 1"

permissions:
  contents: read
  security-events: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  analyze:
    name: analyze (javascript-typescript)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      # actions/checkout v4
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10

      # github/codeql-action/init v4.36.2
      - uses: github/codeql-action/init@54f647b7e1bb85c95cddabcd46b0c578ec92bc1a
        with:
          languages: javascript-typescript
          queries: security-and-quality

      # github/codeql-action/analyze v4.36.2
      - uses: github/codeql-action/analyze@54f647b7e1bb85c95cddabcd46b0c578ec92bc1a
        with:
          category: "/language:javascript-typescript"
